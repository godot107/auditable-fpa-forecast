[options]
; Each OCA repo is a directory of modules, so every repo root needs to be on the
; addons path — Odoo does not search recursively.
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons/mis-builder,/mnt/extra-addons/account-budgeting,/mnt/extra-addons/reporting-engine,/mnt/extra-addons/server-ux

db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; Demo-local only. Never use these settings on anything reachable from outside.
admin_passwd = admin
list_db = True
