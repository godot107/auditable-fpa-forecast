[pytest]
# Collect only this project's tests. ``docker/addons/`` holds four vendored OCA
# repositories fetched by ``docker/fetch-addons.sh``; they carry ~90 Odoo test
# modules that import ``odoo`` and fail collection outside a running server.
# Without this, ``pytest -q`` reports 87 collection errors and runs nothing.
testpaths = tests
addopts = -q
markers =
    slow: runs NUTS; needs the optional NumPyro stack (requirements-bayes.txt)
